<!doctype html><html><head><meta charset="utf-8"><title>Layout preview</title></head><body>
<script>
/* PREVIEW ONLY: loads the live admin app and rearranges the toolbar. Nothing here changes the live page. */
var PATCH=`<style>
#viewSw{margin-left:0!important}
#soldB{display:none}
body:not(.door) #soldB{display:inline-block}
body.door #posMoveT{display:none!important}
@media (max-width:640px){
 #show{flex:1 1 calc(100% - 80px)!important;min-width:0!important;width:auto!important}
 #viewSw,#admTools{width:100%;flex-wrap:wrap;gap:5px!important}
 #viewSw>button,#admTools>button{flex:1 1 0!important;min-width:0!important;padding:9px 1px!important;font-size:11px!important;letter-spacing:-.2px;white-space:nowrap;margin:0!important}
}
</style>
<script>
(function(){
 var sw=document.getElementById("viewSw"),pm=document.getElementById("posMoveT"),tm=document.getElementById("tmode"),un=document.getElementById("undoB");
 if(!sw||!pm||!tm||!un)return;
 pm.style.cssText="padding:8px 12px;font-size:16px;border:2px solid #222;border-radius:8px";
 sw.appendChild(pm);
 var s=document.createElement("button");s.id="soldB";s.type="button";s.textContent="Sold Out";
 s.title="Mark this show sold out (preview: asks first, changes nothing yet)";
 s.onclick=function(){var n=document.getElementById("show");var nm=n&&n.options[n.selectedIndex]?n.options[n.selectedIndex].text:"this show";if(!confirm("Mark SOLD OUT?\\n\\n"+nm+"\\n\\nGuests will see it as sold out and no new tickets can be sold online. You can turn it back on."))return;toast("Preview only - nothing was changed")};
 tm.insertAdjacentElement("afterend",s);
 var _sv=setView;setView=function(v){_sv(v);pm.style.display=(v==="admin"&&!DOOR)?"":"none"};
 pm.style.display=(S.view==="admin"&&!DOOR)?"":"none";
 var nb=document.getElementById("vNames");
 function fix(){
  if(pm){var t=pm.textContent;if(/^POS moves/.test(t))pm.textContent=t.replace("POS moves","POS Moves")}
  if(nb){var want=S.tnames?"Go to Numbers":"Go to Names";if(nb.textContent!==want)nb.textContent=want}
 }
 [pm,nb].forEach(function(e){if(e)new MutationObserver(fix).observe(e,{childList:true,characterData:true,subtree:true})});
 fix();
 markUndo=function(){try{UNDO.push(snapState());if(UNDO.length>5)UNDO.shift();var u=document.getElementById("undoB");if(u)u.disabled=false}catch(e){}};
 var b=document.createElement("div");b.style.cssText="position:fixed;top:0;right:0;background:#b00;color:#fff;font:11px system-ui;padding:2px 6px;z-index:99999";b.textContent="LAYOUT PREVIEW";document.body.appendChild(b);
})();
<\/script>`;
fetch("/index.html?cb="+Date.now()).then(function(r){return r.text()}).then(function(t){
 var i=t.lastIndexOf("</body>");t=t.slice(0,i)+PATCH+t.slice(i);
 document.open();document.write(t);document.close();
});
</script></body></html>
